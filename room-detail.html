<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>(function(){try{var t=localStorage.getItem('tz_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Details — TZ-Rooms</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo">TZ<span>-Rooms</span></a>
    <div class="navbar-right">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode">
            <svg class="icon-sun" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <div class="nav-links" id="nav-links"></div>
    </div>
</nav>

<main class="container" style="max-width:1100px;padding:1.5rem 1rem 2rem">
    <div id="room-detail-content">
        <p class="text-center" style="padding:3rem">Loading room details...</p>
    </div>
</main>

<!-- ===== PAYMENT MODAL ===== -->
<!-- Hidden by default. Opens when user clicks "Book & Pay". -->
<div class="modal-overlay" id="payment-modal">
    <div class="modal">
        <h3>Pay with Mobile Money</h3>
        <p style="margin-bottom:1rem;color:var(--text-muted)">
            Amount: <strong id="modal-amount"></strong>
        </p>

        <!-- Alert shown if payment initiation fails -->
        <div id="payment-alert" class="alert hidden"></div>

        <!-- FORM STATE: user enters phone and selects provider -->
        <div id="payment-form">
            <p style="font-size:0.88rem;margin-bottom:0.6rem;color:var(--text-muted)">Select your provider:</p>
            <div class="provider-grid">
                <button class="provider-btn" onclick="selectProvider(this, 'MPESA')">M-Pesa</button>
                <button class="provider-btn" onclick="selectProvider(this, 'TIGOPESA')">Tigo Pesa</button>
                <button class="provider-btn" onclick="selectProvider(this, 'AIRTEL')">Airtel Money</button>
                <button class="provider-btn" onclick="selectProvider(this, 'HALOPESA')">HaloPesa</button>
            </div>
            <input type="hidden" id="selected-provider" value="MPESA">

            <div class="form-group" style="margin-top:0.8rem">
                <label for="payment-phone">Phone Number for Prompt</label>
                <input type="tel" id="payment-phone" placeholder="0712 345 678">
                <p class="form-hint">A PIN prompt will be pushed to this number.</p>
            </div>

            <div style="display:flex;gap:0.6rem;margin-top:0.5rem">
                <button class="btn btn-primary" id="pay-btn" style="flex:1">Pay Now</button>
                <button class="btn btn-outline" onclick="closePaymentModal()" style="flex:0 0 auto">Cancel</button>
            </div>
        </div>

        <!-- WAITING STATE: shown after STK push is sent -->
        <div id="payment-waiting" class="hidden" style="text-align:center;padding:1rem">
            <span class="spinner"></span>
            <p id="polling-status" style="margin-top:0.8rem;color:var(--text-muted)">Waiting for confirmation...</p>
            <p style="font-size:0.82rem;color:var(--text-muted);margin-top:0.4rem">Enter your PIN on your phone to complete payment.</p>
        </div>

        <!-- SUCCESS STATE -->
        <div id="payment-success" class="hidden" style="text-align:center;padding:1rem">
            <p style="font-size:2rem">✓</p>
            <p style="color:var(--success);font-weight:600">Payment Successful!</p>
            <p style="font-size:0.88rem;color:var(--text-muted);margin-top:0.4rem">Redirecting to your bookings...</p>
        </div>
    </div>
</div>

<footer>
    <p><strong>TZ-Rooms</strong> &copy; 2026</p>
</footer>

<script src="assets/js/main.js"></script>
<script src="assets/js/payment.js"></script>
<script>
    // Read the room ID from the URL: /room-detail.html?id=5
    const roomId = new URLSearchParams(window.location.search).get('id');

    async function loadRoomDetail() {
        const content = document.getElementById('room-detail-content');
        if (!roomId) {
            content.innerHTML = '<p class="text-center" style="color:var(--danger)">No room ID specified.</p>';
            return;
        }

        try {
            // We reuse the rooms/read.php endpoint — in production you'd have a read-single.php
            const res  = await fetch('api/rooms/read.php');
            const data = await res.json();
            const room = data.rooms?.find(r => r.id == roomId);

            if (!room) {
                content.innerHTML = '<p class="text-center" style="color:var(--danger)">Room not found.</p>';
                return;
            }

            document.title = room.title + ' — TZ-Rooms';

            const images = room.images.map((src, i) =>
                `<img src="${src}" alt="Room photo ${i+1}" loading="lazy"
                      onerror="this.src='assets/img/placeholder.jpg'">`
            ).join('') || `<img src="assets/img/placeholder.jpg" alt="${room.title}">`;

            const amenityTags = room.amenities
                .map(a => `<span class="tag">${a}</span>`).join('');

            const areaLabel   = room.location.split(',')[0].trim();
            const ownerFirst  = room.owner_name.split(' ')[0];

            content.innerHTML = `
                <div class="detail-layout">
                    <div class="detail-content">
                        <div class="detail-gallery">${images}</div>

                        <h2 class="detail-title">${room.title}</h2>
                        <p class="detail-location">📍 ${room.location}</p>
                        <div class="amenities">${amenityTags}</div>

                        <div class="detail-block">
                            <h4>Description</h4>
                            <p>${room.description}</p>
                        </div>
                    </div>

                    <aside class="detail-summary">
                        <p class="price-big">${formatTZS(room.price_per_month)}<small>/month</small></p>

                        <div class="spec-grid" style="margin-bottom:1.2rem">
                            <div class="spec-box">
                                <div class="spec-value">${room.amenities.length}</div>
                                <div class="spec-label">Amenities</div>
                            </div>
                            <div class="spec-box">
                                <div class="spec-value">${areaLabel}</div>
                                <div class="spec-label">Area</div>
                            </div>
                            <div class="spec-box">
                                <div class="spec-value">${ownerFirst}</div>
                                <div class="spec-label">Landlord</div>
                            </div>
                        </div>

                        <div id="booking-alert" class="alert hidden"></div>

                        <div class="date-grid">
                            <div>
                                <label for="start-date">Move-in Date</label>
                                <input type="date" id="start-date" min="${new Date().toISOString().split('T')[0]}">
                            </div>
                            <div>
                                <label for="end-date">Move-out Date</label>
                                <input type="date" id="end-date">
                            </div>
                        </div>
                        <button id="book-btn" class="btn btn-accent btn-full"
                                onclick="initiateBooking(${room.id}, ${room.price_per_month})">
                            Book &amp; Pay
                        </button>

                        <div class="detail-block" style="margin-top:1.3rem;margin-bottom:0">
                            <h4>Contact Landlord</h4>
                            <p>${room.owner_name} &mdash; <a href="tel:${room.owner_phone}">${room.owner_phone}</a></p>
                        </div>
                    </aside>
                </div>
            `;
        } catch (err) {
            content.innerHTML = '<p class="text-center" style="color:var(--danger)">Failed to load room. Try again.</p>';
        }
    }

    document.addEventListener('DOMContentLoaded', loadRoomDetail);
</script>
</body>
</html>

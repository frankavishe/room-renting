<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Details — TZ-Rooms</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo">TZ<span>-Rooms</span></a>
    <div class="nav-links" id="nav-links"></div>
</nav>

<main class="container" style="max-width:720px;padding:1.5rem 1rem">
    <div id="room-detail-content">
        <p class="text-center" style="padding:3rem">Loading room details...</p>
    </div>
</main>

<!-- ===== PAYMENT MODAL ===== -->
<!-- Hidden by default. Opens when user clicks "Book & Pay". -->
<div class="modal-overlay" id="payment-modal">
    <div class="modal">
        <h3>Pay with Mobile Money</h3>
        <p style="margin-bottom:1rem;color:#555">
            Amount: <strong id="modal-amount"></strong>
        </p>

        <!-- Alert shown if payment initiation fails -->
        <div id="payment-alert" class="alert hidden"></div>

        <!-- FORM STATE: user enters phone and selects provider -->
        <div id="payment-form">
            <p style="font-size:0.88rem;margin-bottom:0.6rem;color:#666">Select your provider:</p>
            <div class="provider-grid">
                <button class="provider-btn" onclick="selectProvider(this, 'MPESA')">M-Pesa</button>
                <button class="provider-btn" onclick="selectProvider(this, 'TIGOPESA')">Tigo Pesa</button>
                <button class="provider-btn" onclick="selectProvider(this, 'AIRTEL')">Airtel Money</button>
                <button class="provider-btn" onclick="selectProvider(this, 'HALOPESA')">HaloPesa</button>
            </div>
            <input type="hidden" id="selected-provider" value="MPESA">

            <div class="form-group" style="margin-top:0.8rem">
                <label for="payment-phone">Phone Number for Prompt</label>
                <input type="tel" id="payment-phone" placeholder="0712 345 678">
                <p class="form-hint">A PIN prompt will be pushed to this number.</p>
            </div>

            <div style="display:flex;gap:0.6rem;margin-top:0.5rem">
                <button class="btn btn-primary" id="pay-btn" style="flex:1">Pay Now</button>
                <button class="btn btn-outline" onclick="closePaymentModal()" style="flex:0 0 auto">Cancel</button>
            </div>
        </div>

        <!-- WAITING STATE: shown after STK push is sent -->
        <div id="payment-waiting" class="hidden" style="text-align:center;padding:1rem">
            <span class="spinner"></span>
            <p id="polling-status" style="margin-top:0.8rem;color:#555">Waiting for confirmation...</p>
            <p style="font-size:0.82rem;color:#888;margin-top:0.4rem">Enter your PIN on your phone to complete payment.</p>
        </div>

        <!-- SUCCESS STATE -->
        <div id="payment-success" class="hidden" style="text-align:center;padding:1rem">
            <p style="font-size:2rem">✓</p>
            <p style="color:#155724;font-weight:600">Payment Successful!</p>
            <p style="font-size:0.88rem;color:#555;margin-top:0.4rem">Redirecting to your bookings...</p>
        </div>
    </div>
</div>

<footer>
    <p><strong>TZ-Rooms</strong> &copy; 2026</p>
</footer>

<script src="assets/js/main.js"></script>
<script src="assets/js/payment.js"></script>
<script>
    // Read the room ID from the URL: /room-detail.html?id=5
    const roomId = new URLSearchParams(window.location.search).get('id');

    async function loadRoomDetail() {
        const content = document.getElementById('room-detail-content');
        if (!roomId) {
            content.innerHTML = '<p class="text-center" style="color:red">No room ID specified.</p>';
            return;
        }

        try {
            // We reuse the rooms/read.php endpoint — in production you'd have a read-single.php
            const res  = await fetch('api/rooms/read.php');
            const data = await res.json();
            const room = data.rooms?.find(r => r.id == roomId);

            if (!room) {
                content.innerHTML = '<p class="text-center" style="color:red">Room not found.</p>';
                return;
            }

            document.title = room.title + ' — TZ-Rooms';

            const images = room.images.map((src, i) =>
                `<img src="${src}" alt="Room photo ${i+1}" loading="lazy"
                      onerror="this.src='assets/img/placeholder.jpg'"
                      style="width:100%;height:260px;object-fit:cover;border-radius:8px;margin-bottom:0.6rem">`
            ).join('') || `<img src="assets/img/placeholder.jpg" style="width:100%;height:260px;object-fit:cover;border-radius:8px;margin-bottom:0.6rem">`;

            const amenityTags = room.amenities
                .map(a => `<span class="tag">${a}</span>`).join('');

            content.innerHTML = `
                ${images}
                <h2 style="margin:1rem 0 0.3rem">${room.title}</h2>
                <p style="color:#6c757d;margin-bottom:0.8rem">📍 ${room.location}</p>
                <p style="font-size:1.4rem;font-weight:700;color:var(--primary);margin-bottom:0.8rem">
                    ${formatTZS(room.price_per_month)}<small style="font-size:0.9rem;font-weight:400">/month</small>
                </p>
                <div class="amenities" style="margin-bottom:1rem">${amenityTags}</div>
                <h4 style="margin-bottom:0.5rem">Description</h4>
                <p style="color:#444;margin-bottom:1.5rem;line-height:1.7">${room.description}</p>
                <h4 style="margin-bottom:0.3rem">Contact Landlord</h4>
                <p style="margin-bottom:1.5rem">
                    ${room.owner_name} &mdash;
                    <a href="tel:${room.owner_phone}">${room.owner_phone}</a>
                </p>

                <div id="booking-alert" class="alert hidden"></div>

                <h4 style="margin-bottom:0.8rem">Book This Room</h4>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;margin-bottom:0.8rem">
                    <div>
                        <label style="font-size:0.85rem;display:block;margin-bottom:0.3rem">Move-in Date</label>
                        <input type="date" id="start-date"
                               style="width:100%;padding:0.55rem 0.7rem;border:1.5px solid #dee2e6;border-radius:8px;font-size:0.9rem"
                               min="${new Date().toISOString().split('T')[0]}">
                    </div>
                    <div>
                        <label style="font-size:0.85rem;display:block;margin-bottom:0.3rem">Move-out Date</label>
                        <input type="date" id="end-date"
                               style="width:100%;padding:0.55rem 0.7rem;border:1.5px solid #dee2e6;border-radius:8px;font-size:0.9rem">
                    </div>
                </div>
                <button id="book-btn" class="btn btn-accent btn-full"
                        onclick="initiateBooking(${room.id}, ${room.price_per_month})">
                    Book &amp; Pay
                </button>
            `;
        } catch (err) {
            content.innerHTML = '<p class="text-center" style="color:red">Failed to load room. Try again.</p>';
        }
    }

    document.addEventListener('DOMContentLoaded', loadRoomDetail);
</script>
</body>
</html>

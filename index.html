<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>(function(){try{var t=localStorage.getItem('tz_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TZ-Rooms — Find Your Room in Tanzania</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar">
    <a href="index.html" class="logo">TZ<span>-Rooms</span></a>
    <div class="navbar-right">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode">
            <svg class="icon-sun" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <div class="nav-links" id="nav-links">
            <!-- Filled dynamically by main.js based on login state -->
        </div>
    </div>
</nav>

<!-- ===== HERO ===== -->
<section class="hero">
    <div class="container">
        <h1>Find Your Perfect Room in Tanzania</h1>
        <p>Browse thousands of verified rooms in Dar es Salaam, Arusha, Dodoma, Mwanza and more.</p>
        <!-- Search bar navigates to rooms.html with query params -->
        <form class="search-bar" id="hero-search"
              onsubmit="handleHeroSearch(event)">
            <input type="text" name="location" placeholder="City or District (e.g. Kinondoni)">
            <input type="number" name="max_price" placeholder="Max Price (TZS)">
            <button type="submit" class="btn btn-primary">Search</button>
        </form>
    </div>
</section>

<!-- ===== FEATURED ROOMS ===== -->
<main class="container">
    <h2 class="section-title">Latest Available Rooms</h2>
    <div class="rooms-grid" id="rooms-grid">
        <!-- Room cards injected by loadRooms() in main.js -->
    </div>
</main>

<!-- ===== FOOTER ===== -->
<footer>
    <p><strong>TZ-Rooms</strong> &copy; 2026 — Connecting tenants and landlords across Tanzania.</p>
</footer>

<script src="assets/js/main.js"></script>
<script>
    // Load latest rooms on the homepage grid.
    document.addEventListener('DOMContentLoaded', () => loadRooms());

    // Hero search navigates to rooms.html and passes filters as URL query params.
    function handleHeroSearch(e) {
        e.preventDefault();
        const form   = e.target;
        const params = new URLSearchParams();
        const loc    = form.querySelector('[name=location]').value.trim();
        const maxP   = form.querySelector('[name=max_price]').value.trim();
        if (loc)  params.set('location',  loc);
        if (maxP) params.set('max_price', maxP);
        window.location.href = 'rooms.html?' + params.toString();
    }
</script>
</body>
</html>

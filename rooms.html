<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>(function(){try{var t=localStorage.getItem('tz_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Rooms — TZ-Rooms</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo">TZ<span>-Rooms</span></a>
    <div class="navbar-right">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode">
            <svg class="icon-sun" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <div class="nav-links" id="nav-links"></div>
    </div>
</nav>

<main class="container">
    <h2 class="section-title">Browse Rooms</h2>

    <!-- Filter form: submitting triggers loadRooms() in main.js -->
    <form id="search-form" class="filter-bar">
        <input type="text"   name="location"  placeholder="Location (e.g. Arusha)">
        <input type="number" name="min_price" placeholder="Min TZS">
        <input type="number" name="max_price" placeholder="Max TZS">
        <button type="submit" class="btn btn-primary">Filter</button>
    </form>

    <!-- Cards are rendered here by loadRooms() -->
    <div class="rooms-grid" id="rooms-grid"></div>
</main>

<footer>
    <p><strong>TZ-Rooms</strong> &copy; 2026</p>
</footer>

<script src="assets/js/main.js"></script>
<script>
    // On page load, read any query params from the URL (passed from hero search)
    // and pre-populate the filter form, then load results.
    document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('location'))  document.querySelector('[name=location]').value  = params.get('location');
        if (params.get('max_price')) document.querySelector('[name=max_price]').value = params.get('max_price');
        if (params.get('min_price')) document.querySelector('[name=min_price]').value = params.get('min_price');

        const filters = {};
        if (params.get('location'))  filters.location  = params.get('location');
        if (params.get('max_price')) filters.max_price = params.get('max_price');
        if (params.get('min_price')) filters.min_price = params.get('min_price');
        loadRooms(filters);
    });
</script>
</body>
</html>

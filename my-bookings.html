<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>(function(){try{var t=localStorage.getItem('tz_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings — TZ-Rooms</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo">TZ<span>-Rooms</span></a>
    <div class="navbar-right">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode">
            <svg class="icon-sun" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <div class="nav-links" id="nav-links"></div>
    </div>
</nav>

<main class="container">
    <h2 class="section-title">My Bookings</h2>
    <div id="bookings-list">
        <p class="text-center" style="padding:2rem">Loading your bookings...</p>
    </div>
</main>

<footer>
    <p><strong>TZ-Rooms</strong> &copy; 2026</p>
</footer>

<script src="assets/js/main.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const user = Auth.getUser();
        if (!user) { window.location.href = 'login.html'; return; }

        const list = document.getElementById('bookings-list');

        try {
            const res  = await fetch('api/bookings/my.php', {
                headers: { 'Authorization': 'Bearer ' + Auth.getToken() }
            });
            const data = await res.json();

            if (!data.bookings || data.bookings.length === 0) {
                list.innerHTML = `
                    <p class="text-center" style="padding:2rem;color:var(--text-muted)">
                        No bookings yet. <a href="rooms.html">Browse rooms</a>
                    </p>`;
                return;
            }

            list.innerHTML = data.bookings.map(b => `
                <div class="booking-card">
                    <div>
                        <strong>${b.room_title}</strong>
                        <p class="location">📍 ${b.location}</p>
                        <p class="dates">${b.start_date} → ${b.end_date}</p>
                    </div>
                    <div class="meta">
                        <span class="badge badge-${b.status}">${b.status}</span>
                        <p class="price">${formatTZS(b.price_per_month)}/mo</p>
                    </div>
                </div>
            `).join('');

        } catch (err) {
            list.innerHTML = '<p class="text-center" style="color:red">Failed to load bookings.</p>';
        }
    });
</script>
</body>
</html>
